    <text x="916" y="41" fill="#6C8493" font-size="10" font-weight="600" text-anchor="end" letter-spacing="1.2">UI ILLUSTRATION · SYNTHETIC DATA</text>

    <g filter="url(#window-shadow)" opacity=".7">
      <rect x="74" y="89" width="617" height="393" rx="13" fill="#F8FBFD" stroke="#CBD9E2"/>
      <g clip-path="url(#window-clip)">
        <path d="M74 102C74 94.82 79.82 89 87 89H678C685.18 89 691 94.82 691 102V129H74V102Z" fill="#E8F0F5"/>
