        <text x="622" y="572" fill="#E5F4FC" text-anchor="end">58%</text>
        <text x="659" y="572" fill="#A7C0D0">7D</text>
        <text x="755" y="572" fill="#E5F4FC" text-anchor="end">32%</text>
