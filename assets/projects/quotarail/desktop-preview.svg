          <text x="240" y="201">1</text><text x="240" y="227">2</text><text x="240" y="253">3</text><text x="240" y="279">4</text><text x="240" y="305">5</text><text x="240" y="331">6</text><text x="240" y="357">7</text><text x="240" y="383">8</text><text x="240" y="409">9</text><text x="240" y="435">10</text>
        </g>
      </g>
    </g>

