<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">QuotaRail taskbar usage monitor illustration</title>
  <desc id="desc">A Windows-inspired desktop with a small QuotaRail usage panel and a persistent taskbar quota display. Synthetic data shows 58 percent remaining in the five-hour window and 32 percent remaining in the seven-day window. This is a static UI illustration, not a screenshot of a real account.</desc>
  <defs>
    <linearGradient id="desktop" x1="96" y1="0" x2="844" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F8FA"/>
      <stop offset="1" stop-color="#DCE8ED"/>
    </linearGradient>
    <linearGradient id="fold" x1="475" y1="116" x2="853" y2="525" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8CDD7" stop-opacity=".5"/>
      <stop offset="1" stop-color="#D6E4EB" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="panel" x1="515" y1="172" x2="863" y2="502" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B3145"/>
      <stop offset="1" stop-color="#12283A"/>
    </linearGradient>
    <linearGradient id="five-hour" x1="543" y1="309" x2="716" y2="309" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68C7EF"/>
      <stop offset="1" stop-color="#7DD9E9"/>
    </linearGradient>
    <filter id="window-shadow" x="34" y="59" width="713" height="482" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="19" flood-color="#3D5D72" flood-opacity=".10"/>
    </filter>
    <filter id="panel-shadow" x="467" y="137" width="444" height="430" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="19" stdDeviation="23" flood-color="#173D57" flood-opacity=".22"/>
    </filter>
    <filter id="bar-shadow" x="5" y="519" width="950" height="115" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#243C4A" flood-opacity=".14"/>
    </filter>
    <clipPath id="window-clip"><rect x="74" y="89" width="617" height="393" rx="13"/></clipPath>
  </defs>

  <rect width="960" height="640" rx="24" fill="url(#desktop)"/>
  <path d="M539 65C647 23 807 60 920 185V520C792 522 653 480 601 379C548 277 642 190 539 65Z" fill="url(#fold)"/>
  <path d="M650 96C755 146 762 228 748 319C735 405 798 456 923 474" stroke="#FFFFFF" stroke-opacity=".36" stroke-width="1.5"/>
  <path d="M646 98C613 237 872 255 893 403" stroke="#B3CBD6" stroke-opacity=".3" stroke-width="1.5"/>

  <g font-family="'Segoe UI', Aptos, sans-serif">
