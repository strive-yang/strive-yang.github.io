      <text x="542" y="308" fill="#F2F8FC" font-size="31" font-weight="600" letter-spacing="-1.4">58<tspan font-size="20" letter-spacing="-.6">%</tspan><tspan dx="10" fill="#9BB5C5" font-size="12" font-weight="400" letter-spacing="0">remaining</tspan></text>
      <text x="836" y="302" fill="#6DCDEA" font-size="12" text-anchor="end" font-weight="600">5H</text>
      <rect x="542" y="324" width="294" height="7" rx="3.5" fill="#2A4355"/>
      <rect x="542" y="324" width="170.5" height="7" rx="3.5" fill="url(#five-hour)"/>

      <text x="542" y="371" fill="#A5BDC9" font-size="10" font-weight="600" letter-spacing="1.5">7-DAY WINDOW</text>
      <text x="542" y="405" fill="#F2F8FC" font-size="31" font-weight="600" letter-spacing="-1.4">32<tspan font-size="20" letter-spacing="-.6">%</tspan><tspan dx="10" fill="#9BB5C5" font-size="12" font-weight="400" letter-spacing="0">remaining</tspan></text>
      <text x="836" y="399" fill="#83D5BA" font-size="12" text-anchor="end" font-weight="600">7D</text>
      <rect x="542" y="421" width="294" height="7" rx="3.5" fill="#2A4355"/>
      <rect x="542" y="421" width="94.1" height="7" rx="3.5" fill="#83D5BA"/>

      <path d="M542 453H836" stroke="#DAEDFA" stroke-opacity=".1"/>
      <circle cx="546" cy="476" r="3" stroke="#A0B8C6" stroke-width="1.1"/>
      <text x="557" y="480" fill="#A0B8C6" font-size="10.5">Codex usage, a glance away.</text>
      <path d="M791 502L801 512L811 502" fill="#142B3D"/>
      <path d="M791 502L801 512L811 502" stroke="#617F93" stroke-opacity=".3"/>
    </g>

    <g filter="url(#bar-shadow)">
      <rect x="26" y="542" width="908" height="68" rx="15" fill="#172D3E"/>
      <rect x="26.5" y="542.5" width="907" height="67" rx="14.5" stroke="#B2CCD9" stroke-opacity=".25"/>
