      <text x="82" y="228" fill="#697B70" font-size="13">New chat</text>
      <text x="82" y="264" fill="#697B70" font-size="13">Search chats</text>
      <text x="61" y="317" fill="#98A59B" font-size="11" letter-spacing=".5">YOUR CHATS</text>
