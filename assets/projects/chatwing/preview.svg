      <rect x="335" y="482" width="369" height="60" rx="17" fill="#F2F5EF"/>
      <text x="355" y="519" fill="#5A7061" font-size="18">What should each item show?</text>
      <g fill="#D1DBD1"><rect x="252" y="572" width="365" height="6" rx="3"/><rect x="252" y="590" width="298" height="6" rx="3"/></g>
      <rect x="237" y="620" width="511" height="36" rx="18" fill="#FAFBF8" stroke="#E2E8DE"/>
