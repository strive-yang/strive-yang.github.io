<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ChatWing conversation outline illustration</title>
  <desc id="desc">A light browser interface shows a ChatGPT conversation on the left and a compact ChatWing question outline on the right. One question is selected and highlighted in the conversation. A floating hover preview shows the full question and the beginning of its answer. The outline has refresh, pin and close controls. All conversation text is fictional. This is a UI illustration, not an actual screenshot.</desc>
  <defs>
    <filter id="window-shadow" x="8" y="74" width="1064" height="632" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#25483F" flood-opacity=".07"/>
    </filter>
    <filter id="card-shadow" x="466" y="229" width="574" height="390" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#25483F" flood-opacity=".09"/>
    </filter>
    <clipPath id="window-clip"><rect x="40" y="102" width="1000" height="568" rx="15"/></clipPath>
  </defs>

  <rect width="1080" height="760" fill="#EDF4F2"/>
  <g font-family="Aptos, 'Segoe UI', sans-serif">
    <g transform="translate(42 32)">
      <rect width="35" height="35" rx="10" fill="#1D6A58"/>
      <g fill="#F4FAF7">
        <circle cx="10" cy="11" r="1.8"/><circle cx="10" cy="18" r="1.8"/><circle cx="10" cy="25" r="1.8"/>
        <rect x="16" y="9.5" width="12" height="3" rx="1.5"/><rect x="16" y="16.5" width="10" height="3" rx="1.5"/><rect x="16" y="23.5" width="6" height="3" rx="1.5"/>
      </g>
    </g>
    <text x="89" y="49" fill="#1D4338" font-size="22" font-weight="650">ChatWing</text>
    <text x="89" y="68" fill="#59736A" font-size="11" font-weight="600" letter-spacing="1.7">CHAT OUTLINE</text>
    <text x="1038" y="56" fill="#687E76" font-size="10" text-anchor="end" letter-spacing="1.35">UI ILLUSTRATION / DEMO TEXT</text>

    <g filter="url(#window-shadow)">
      <rect x="40" y="102" width="1000" height="568" rx="15" fill="#FFFFFF" stroke="#CDDAD5"/>
    </g>
    <g clip-path="url(#window-clip)">
      <path d="M40 102H1040V148H40V102Z" fill="#F7FAF8"/>
      <path d="M40 148H1040" stroke="#DDE6E1"/>
      <g fill="#C6D5CD"><circle cx="62" cy="125" r="3.5"/><circle cx="76" cy="125" r="3.5"/><circle cx="90" cy="125" r="3.5"/></g>
      <rect x="228" y="111" width="564" height="27" rx="7" fill="#EEF3EF"/>
      <path d="M245 123V121A3 3 0 0 1 251 121V123M244 123H252V130H244V123Z" stroke="#7B9186" stroke-width="1.2" stroke-linejoin="round"/>
      <text x="264" y="129" fill="#72867C" font-size="12">chatgpt.com</text>
      <rect x="991" y="111" width="28" height="28" rx="7" fill="#E2EDE6"/>
      <g stroke="#31705A" stroke-width="1.8" stroke-linecap="round">
        <path d="M1002 120H1011M1002 125H1010M1002 130H1006"/>
      </g>
      <g fill="#31705A"><circle cx="997" cy="120" r="1.1"/><circle cx="997" cy="125" r="1.1"/><circle cx="997" cy="130" r="1.1"/></g>

