    <rect x="794" y="292" width="211" height="81" rx="7" fill="#EDF5EF"/>
    <text x="807" y="318" fill="#29533D" font-size="17">Can we make long chats</text>
    <text x="807" y="342" fill="#29533D" font-size="17">easier to navigate?</text>
    <text x="807" y="402" fill="#53695B" font-size="17">What should each</text>
    <text x="807" y="426" fill="#53695B" font-size="17">item show?</text>
    <text x="807" y="479" fill="#53695B" font-size="17">Can I jump back</text>
    <text x="807" y="503" fill="#53695B" font-size="17">to that question?</text>
    <text x="807" y="555" fill="#53695B" font-size="17">Keep it out of the way.</text>

    <text x="509" y="322" fill="#304C3D" font-size="17">Can we make long chats</text>
    <text x="509" y="346" fill="#304C3D" font-size="17">easier to navigate?</text>
    <path d="M509 363H748" stroke="#E4EAE3"/>
    <text x="509" y="394" fill="#819084" font-size="16">Keep the context close.</text>
    <text x="509" y="421" fill="#819084" font-size="16">A quiet outline turns each</text>
    <text x="509" y="445" fill="#819084" font-size="16">question into a place you</text>
    <text x="509" y="469" fill="#819084" font-size="16">can return to.</text>
    <rect x="754" y="380" width="3" height="97" rx="1.5" fill="#F0F3EF"/>
    <rect x="754" y="380" width="3" height="43" rx="1.5" fill="#C1D0C3"/>

    <path d="M992 345L992 367L997 362L1001 371L1006 369L1002 360L1009 359L992 345Z" fill="#426B53" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="1021" y="342" width="11" height="103" rx="5.5" fill="#F0F4F0" stroke="#E3EBE3"/>
    <path d="M1024 357H1029M1024 369H1029M1024 381H1029M1024 393H1029M1024 405H1029M1024 417H1029M1024 429H1029" stroke="#C1CEC2" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M1024 381H1029" stroke="#2F7B58" stroke-width="2.2" stroke-linecap="round"/>

    <text x="42" y="716" fill="#2C5946" font-family="Georgia, 'Times New Roman', serif" font-size="25">Less scrolling. More context.</text>
    <path d="M697 712H719M714 707L719 712L714 717" stroke="#668C76" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="733" y="718" fill="#607C6A" font-size="14" letter-spacing=".2">Hover to preview · Click to return</text>
